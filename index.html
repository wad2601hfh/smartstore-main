<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-950 h-screen w-screen flex flex-col font-sans overflow-hidden text-white">

    <div class="aurora-gradient absolute inset-0 -z-10"></div>
    <div class="absolute inset-0 bg-black/40 -z-10 backdrop-blur-[80px]"></div>

    <div class="flex-1 flex flex-col max-w-4xl mx-auto w-full h-full glass-panel border-x border-white/10 shadow-2xl relative overflow-hidden">
        
        <header class="p-4 flex justify-between items-center bg-black/40 border-b border-white/10 z-20 shrink-0 backdrop-blur-md">
            <h1 class="text-xl font-bold flex items-center gap-2 tracking-wide neon-text">
                <i class="fas fa-bolt text-emerald-400"></i> Smart Store
            </h1>
            <div class="flex gap-2">
                <button id="btn-history" onclick="toggleHistory()" class="bg-white/10 px-4 py-1.5 rounded-full text-xs font-bold hover:bg-white/20 transition">
                    <i class="fas fa-history"></i> History
                </button>
                <button id="toggle-role-btn" onclick="toggleRole()" class="role-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all duration-300">
                    Switch to Seller
                </button>
            </div>
        </header>

        <div id="buyer-view" class="flex-1 flex flex-col min-h-0 relative">
            <main id="chat-area" class="flex-1 p-5 overflow-y-auto space-y-4 scroll-smooth">
                <div class="bot-msg message-bubble slide-in">
                    <div class="text-xs text-emerald-400 font-bold mb-1 tracking-wider">ASSISTANT</div>
                    <p>Welcome! Type what you're craving (e.g., "2 nasi goreng"). We'll use your location to find nearby sellers.</p>
                </div>
            </main>
            
            <div id="finish-btn-container" class="hidden px-4 pb-3 bg-black/60 backdrop-blur-md">
                <button onclick="closeRequest()" class="w-full bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500 hover:text-white font-bold py-2.5 rounded-xl text-sm transition-all duration-300 active:scale-95 flex justify-center items-center gap-2 disabled:opacity-50">
                    <i class="fas fa-times-circle"></i> Cancel Request
                </button>
            </div>

            <footer class="p-4 bg-black/80 border-t border-white/10 shrink-0 backdrop-blur-lg">
                <form onsubmit="event.preventDefault(); sendRequest();" class="flex gap-3">
                    <input type="text" id="user-input" placeholder="I'm craving..." class="flex-1 bg-white/5 text-white px-5 py-3 rounded-2xl border border-white/10 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 transition-all placeholder:text-gray-500 disabled:opacity-50">
                    <button type="submit" id="send-btn" class="bg-gradient-to-r from-emerald-500 to-teal-500 text-black px-6 rounded-2xl font-bold hover:shadow-lg hover:shadow-emerald-500/30 active:scale-95 transition-all duration-200 flex items-center justify-center min-w-[60px] disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </footer>
        </div>

        <div id="seller-container" class="hidden flex-1 flex-col min-h-0 bg-black/20">
            <div id="seller-map" class="h-48 w-full border-b border-emerald-500/20 z-10 bg-gray-900"></div>
            <div class="p-2 bg-emerald-900/20 text-center shrink-0 border-b border-emerald-500/10">
                <h2 class="font-bold text-emerald-400 text-[10px] tracking-[0.2em] uppercase">Live Buyer Locations</h2>
            </div>
            <div id="seller-requests" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        </div>

        <div id="history-container" class="hidden flex-1 flex-col min-h-0 bg-black/20 p-5 overflow-y-auto">
            <h2 class="text-xl font-bold text-emerald-400 mb-4 border-b border-white/10 pb-2"><i class="fas fa-receipt"></i> Order History</h2>
            <div id="history-list" class="space-y-3"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
